name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest --cov=bfd --cov-report=term-missing

      - name: Smoke-test the pipeline end to end
        run: |
          python - <<'PY'
          from bfd.config import Config
          from bfd.dataset import generate
          from bfd import baseline

          cfg = Config()
          cfg.data.per_class = {"train": 10, "test": 6}
          cfg.data.seeds = {"train": 1, "test": 2}

          train = generate(cfg, "train", "A")
          model, _ = baseline.fit(train, cfg.rig.sample_rate)
          for condition in ("A", "D"):
              test = generate(cfg, "test", condition)
              predictions = baseline.predict(model, test, cfg.rig.sample_rate)
              print(condition, "accuracy", (predictions == test.y).mean())
          PY
